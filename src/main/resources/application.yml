spring:
  application:
    name: restaurantos-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/restaurantos}
    username: ${DATABASE_USERNAME:restaurantos}
    password: ${DATABASE_PASSWORD:restaurantos}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.restaurantos: INFO
    org.springframework.security: INFO
