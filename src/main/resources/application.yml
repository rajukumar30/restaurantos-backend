spring:
  application:
    name: restaurantos-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/restaurantos}
    username: ${DATABASE_USERNAME:restaurantos}
    password: ${DATABASE_PASSWORD:restaurantos}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.restaurantos: INFO
    org.springframework.security: INFO

restaurantos:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-this-to-a-long-random-secret-at-least-32-bytes}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  bootstrap:
    admin-email: ${PLATFORM_ADMIN_EMAIL:}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:}
    admin-name: ${PLATFORM_ADMIN_NAME:Platform Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
