name: Deploy Krlio backend to Azure

# Manual deployment until Azure OIDC and application settings are configured.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build executable JAR
        run: mvn -B -ntp clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: krlio-backend
          path: target/restaurantos-backend-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: krlio-backend

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy JAR to Krlio App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: Krlio
          package: restaurantos-backend-0.1.0-SNAPSHOT.jar
